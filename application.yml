# Ce fichier est pour les configurations partagées par tous
app:
  version: "1.0.0"
  environment: "default"

# Configuration de actuator pour exposer les endpoints de santé et d'information
management:
  endpoints:
    web:
      exposure:
        include: health,info,refresh

  metrics:
    tags:
      application: ${spring.application.name}

  tracing:
    sampling:
      probability: 1.0
  zipkin:
    tracing:
      endpoint: http://localhost:9411/api/v2/spans

# Ajout de la configuration pour Eureka
eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/